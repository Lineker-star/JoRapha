# CI — blocks broken or unsafe code from reaching main (playbook Step 0.3).
# Every job below is a required status check on main (docs/ops/branch-protection.md).
# Actions are pinned to full commit SHAs; Dependabot keeps them current.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: '0' # never install git hooks on CI runners
  TURBO_TELEMETRY_DISABLED: '1'
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.1
  OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # version comes from "packageManager" in package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.3.0 # same as the root devDependency

      - name: Start Postgres
        run: supabase db start

      - name: Reset (all migrations + seed.sql)
        run: supabase db reset

      - name: pgTAP tests
        run: supabase test db

      - name: Lint database
        run: supabase db lint --schema public,identity,patient,provider,scheduling,clinical,referral,lab,pharmacy,community,billing,content,audit,sync --level warning --fail-on error # extensions (PostGIS internals) excluded: third-party false positives

  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not only the tip
          persist-credentials: false

      - name: Install Gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz

      - name: Scan git history
        # HEAD = the PR merge commit and all its history. Without it gitleaks runs `git log --all` and
        # also scans unrelated branches that fetch-depth 0 pulled in.
        run: gitleaks git --config .gitleaks.toml --log-opts="HEAD" --redact --verbose --no-banner --exit-code 1

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # semgrep/semgrep:1.186.0, pinned by digest
      image: semgrep/semgrep@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        # Findings (and scan errors) are emitted as ::error annotations so they show on the PR.
        run: |
          set +e
          semgrep scan \
            --config p/default \
            --config p/typescript \
            --config p/secrets \
            --error \
            --metrics off \
            --disable-version-check \
            --vim --output semgrep-findings.txt 2> semgrep-stderr.txt
          rc=$?
          set -e
          while IFS= read -r line; do echo "::error title=Semgrep::${line}"; done < semgrep-findings.txt
          if [ "$rc" -ne 0 ] && [ ! -s semgrep-findings.txt ]; then
            tail -n 20 semgrep-stderr.txt | while IFS= read -r line; do echo "::error title=Semgrep error::${line}"; done
          fi
          cat semgrep-stderr.txt
          exit "$rc"

  dependencies:
    name: Dependencies (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install osv-scanner (checksum-verified)
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          rm osv-scanner

      - name: Scan lockfile
        # Fails on any known vulnerability not listed (with a reason and expiry) in osv-scanner.toml.
        run: osv-scanner scan --config osv-scanner.toml --lockfile pnpm-lock.yaml
