# Dependabot — weekly version updates. Security updates are separate (enable "Dependabot security
# updates" in Settings → Code security; see docs/ops/branch-protection.md).
version: 2
updates:
  - package-ecosystem: npm # covers the whole pnpm workspace via the root lockfile
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Douala
    open-pull-requests-limit: 10
    # Matches pnpm's minimumReleaseAge (7 days): never propose a release in its first week.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Expo SDK pins these together; upgrade them only with an SDK upgrade (`expo install --fix`).
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'expo*'
        update-types: [version-update:semver-major]
      # Expo SDK 58 pins react/react-dom to an exact version; change them only with the SDK.
      - dependency-name: react
      - dependency-name: react-dom
      # 2.2.2 was published without the provenance attestation earlier releases carry (pnpm trustPolicy).
      - dependency-name: lefthook
        versions: ['2.2.2']
      # Majors blocked by the toolchain (see CLAUDE.md "Stack"); revisit when the blocker is gone:
      - dependency-name: typescript # typescript-eslint does not support TS 7 yet
        update-types: [version-update:semver-major]
      - dependency-name: eslint # eslint-config-next / plugins do not support ESLint 10 yet
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss # mobile apps: NativeWind 4 requires Tailwind 3.4 (web already on 4)
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node' # keep in step with the Node 22 runtime
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Africa/Douala
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(ci)'
