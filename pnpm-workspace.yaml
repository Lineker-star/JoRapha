packages:
  - apps/*
  - packages/*

# One React version across web and mobile (Expo SDK 58 pins 19.3.0).
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/node': 22.20.5
  typescript: 6.0.3
  vitest: 5.1.1
  eslint: 9.39.5

# Dependency install scripts are denied unless listed true here (supply-chain hardening).
# false = not needed: these packages ship prebuilt binaries as optional dependencies and their
# scripts only verify them or build from source as a fallback.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
